name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bridges
        run: python3 -m py_compile scripts/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
